name: CI

# 目的：讓「後端測試 + 前端測試」在每次推送與 PR 時自動跑，
#       並且把原本因為缺環境變數而預設 skip 的 migration／整合測試也一起跑起來
#       —— 那幾支正是唯一能擋下「migration 忘了套到正式庫」的守門員。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: 後端測試（含 PostgreSQL 整合測試）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    services:
      # 對齊實際使用的 PostgreSQL 18；不合格品併發確效（Task 7）的 fixture
      # 也明確要求 18，版本不符會直接 fail 而非 skip。
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 應用程式的密鑰在下面的步驟即時產生後寫入 $GITHUB_ENV，
      # 不在版控檔案裡留下任何固定值（scan_tracked_secrets.py 會擋）。
      # 各整合測試各自使用獨立 database，彼此不互相汙染
      TOKEN_VERSION_TEST_DATABASE_URL:   postgresql://postgres:postgres@localhost:5432/codex_token50_ci
      ROUTE_PERMISSION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codex_permissions51_ci
      CALIBRATION_TEST_DATABASE_URL:     postgresql://postgres:postgres@localhost:5432/calibration_t49_ci
      ATOMICITY_TEST_DATABASE_URL:       postgresql://postgres:postgres@localhost:5432/codex_atomicity7_ci
      # SPC migration / 並發整合測試（走 psql CLI）
      SPC_POSTGRES_INTEGRATION: '1'
      SPC_PG_HOST: localhost
      SPC_PG_PORT: '5432'
      SPC_PG_USER: postgres
      SPC_PG_PASSWORD: postgres
      SPC_PSQL_PATH: /usr/bin/psql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 產生本次執行用的隨機密鑰
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: 安裝 psql 用戶端與繁體中文字型
        # 8D 與 MSA 報表以 reportlab 產生 PDF，缺 CJK 字型時 msa_report 會直接
        # 擋下（MSA_REPORT_FONT_MISSING），eightd_pdf 則退回 Helvetica 輸出亂碼。
        # 必須是 TrueType 的 wqy：fonts-noto-cjk 是 CFF/PostScript 輪廓，
        # reportlab 會以 "postscript outlines are not supported" 拒絕載入，
        # 裝了也沒有用。
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client fonts-wqy-microhei

      - name: 安裝 Python 依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立整合測試用的 database
        # 資料庫名稱不可任意更動：各 fixture 會檢查前綴，確認自己連的是拋棄式
        # 隔離庫而不是共用或正式庫，前綴不符會直接 fail 而非 skip。
        run: |
          for db in codex_token50_ci codex_permissions51_ci calibration_t49_ci codex_atomicity7_ci; do
            psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done

      - name: 執行 pytest 並阻擋非預期 skip
        run: |
          set -o pipefail
          python -m pytest backend/tests -q -rs 2>&1 | tee pytest-out.txt
          if grep -qE "未設定 (TOKEN_VERSION_TEST_DATABASE_URL|ROUTE_PERMISSION_TEST_DATABASE_URL|CALIBRATION_TEST_DATABASE_URL|ATOMICITY_TEST_DATABASE_URL|PostgreSQL migration|PostgreSQL SPC)" pytest-out.txt; then
            echo "::error::CI 不允許必要的 PostgreSQL 整合測試被 skip"
            exit 1
          fi

  frontend:
    name: 前端測試與建置
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src_frontend/package-lock.json

      - name: 安裝依賴
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 型別檢查與建置
        run: npm run build

      - name: 執行 vitest
        run: npx vitest run
