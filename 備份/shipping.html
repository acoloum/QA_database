<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品保檢驗數據系統 - SPC 完整版</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: #ebf2f7; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .info-item label { font-size: 16px; font-weight: 600; }
        .info-item input, .info-item select { font-size: 16px; }
        .v-table { width: 100%; border-collapse: collapse; text-align: center; }
        .v-table th, .v-table td { border: 1px solid #ddd; padding: 10px; }
        .v-table th { background: #3498db; color: white; font-size: 18px; }
        .num-input { width: 90%; padding: 8px 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 15px; }
        .minmax-container { display: flex; gap: 4px; justify-content: center; }
        .minmax-input { width: 45%; padding: 6px 4px; font-size: 14px; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-main { padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        
        .filter-section { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-top: 40px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; }
        .charts-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .chart-box { background: white; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; height: 450px; position: relative; }
        .chart-label { font-size: 1.1em; font-weight: bold; color: #2d3748; margin-bottom: 10px; display: block; border-left: 4px solid #3498db; padding-left: 10px; }

        .stats-summary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 15px; }
        .stat-item { background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; }
        .stat-value.warning { color: #ffeb3b; }
        .stat-value.danger { color: #ff5252; }
        .stat-value.success { color: #69f0ae; }

        .analysis-panel { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .analysis-item { padding: 10px 15px; margin-bottom: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .analysis-item.warning { background: #fff8e1; border-left: 4px solid #ffc107; }
        .analysis-item.info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        .analysis-item.success { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .analysis-icon { font-size: 20px; }
        .analysis-text { flex: 1; }
        .analysis-title { font-weight: bold; margin-bottom: 2px; }
        .analysis-desc { font-size: 12px; opacity: 0.8; }

        .alarm-accordion { margin-bottom: 20px; border: 2px solid #feb2b2; border-radius: 8px; overflow: hidden; display: none; }
        .alarm-header { background: #fff5f5; padding: 12px 20px; color: #c53030; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .alarm-header::after { content: '▼ 點擊展開詳情'; font-size: 0.8em; }
        .alarm-accordion.open .alarm-header::after { content: '▲ 點擊收合'; }
        .alarm-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #fff; }
        .alarm-accordion.open .alarm-content { max-height: 500px; padding: 10px 20px; overflow-y: auto; }
        .alarm-item { font-size: 0.9em; color: #742a2a; border-bottom: 1px dashed #feb2b2; padding: 8px 0; }
        
        .file-upload-wrapper { position: relative; margin-top: 8px; }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }
        .file-upload-label i {

        }
        .file-name-display {

            border-radius: 6px;

    <script>
        const API_BASE = window.location.protocol === 'file:' 
            ? 'http://localhost:5000' 
            : `${window.location.protocol}//${window.location.hostname}:${window.location.port || '5000'}`;
        let chartX = null, chartR = null, currentEditId = null;
        let authToken = localStorage.getItem('authToken') || '';

    function getAuthHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
        return headers;
    }

    async function fetchWithAuth(url, options = {}) {
        if (!options.headers) options.headers = {};
        Object.assign(options.headers, getAuthHeaders());
        const res = await fetch(url, options);
        if (res.status === 401) {
            alert('認證失效，請重新登入');
            localStorage.removeItem('authToken');
            location.href = 'index.html';
        }
        return res;
    }
    const items = [
        { label: "外徑", key: "外徑", type: "minmax" },
        { label: "內徑", key: "內徑", type: "minmax" },
        { label: "厚度", key: "厚度", type: "minmax" },
        { label: "同心度", key: "同心度", type: "single" },
        { label: "長度", key: "長度", type: "single" },
        { label: "硬度", key: "硬度", type: "single" },
        { label: "真直度", key: "真直度", type: "single" }
    ];

    function buildTable() {
        const vBody = document.getElementById('v-body');
        vBody.innerHTML = "";
        items.forEach((item, rowIndex) => {
            let row = `<tr><th>${item.label}</th>`;
            for (let g = 1; g <= 5; g++) {
                const baseTab = (g * 100) + (rowIndex * 2);
                if (item.type === "minmax") {
                    row += `<td><div class="minmax-container">
                        <input type="number" step="0.001" class="minmax-input num-input" data-key="${item.key}${g}-min" placeholder="Min" tabindex="${baseTab}">
                        <input type="number" step="0.001" class="minmax-input num-input" data-key="${item.key}${g}-max" placeholder="Max" tabindex="${baseTab+1}">
                    </div></td>`;
                } else {
                    row += `<td><input type="number" step="0.001" class="num-input" data-key="${item.key}${g}" tabindex="${baseTab}"></td>`;
                }
            }
            vBody.innerHTML += row + "</tr>";
        });
    }

    function toggleAlarm() { document.getElementById('alarm-panel').classList.toggle('open'); }

    function analyzeWECO(data, cl, ucl, lcl, labels) {
        let violations = [], statuses = new Array(data.length).fill(null);
        const sigma = (ucl - cl) / 3;
        const sigma1_above = cl + sigma;
        const sigma1_below = cl - sigma;
        const sigma2_above = cl + 2 * sigma;
        const sigma2_below = cl - 2 * sigma;

        for (let i = 0; i < data.length; i++) {
            let val = data[i], reasons = [];
            
            // Rule 1: 單點超出控制限 (±3σ)
            if (val > ucl || val < lcl) reasons.push("Rule 1: 超出控制限");
            
            // Rule 2: 連續9點在中心線同側
            if (i >= 8) {
                let last9 = data.slice(i-8, i+1);
                if (last9.every(v => v > cl) || last9.every(v => v < cl)) 
                    reasons.push("Rule 2: 連續9點同側");
            }
            
            // Rule 3: 連續6點連續上升或下降
            if (i >= 5) {
                let last6 = data.slice(i-5, i+1);
                let increasing = true, decreasing = true;
                for (let j = 1; j < last6.length; j++) {
                    if (last6[j] <= last6[j-1]) increasing = false;
                    if (last6[j] >= last6[j-1]) decreasing = false;
                }
                if (increasing || decreasing) reasons.push("Rule 3: 連續6點趨勢");
            }
            
            // Rule 4: 連續14點交替上升下降
            if (i >= 13) {
                let last14 = data.slice(i-13, i+1);
                let alternating = true;
                for (let j = 1; j < last14.length; j++) {
                    if ((j % 2 === 0 && last14[j] < last14[j-1]) || 
                        (j % 2 !== 0 && last14[j] > last14[j-1])) {
                        alternating = false;
                        break;
                    }
                }
                if (alternating) reasons.push("Rule 4: 14點交替");
            }
            
            // Rule 5: 連續3點中有2點落在2σ外
            if (i >= 2) {
                let last3 = data.slice(i-2, i+1);
                let countAbove = last3.filter(v => v > sigma2_above).length;
                let countBelow = last3.filter(v => v < sigma2_below).length;
                if (countAbove >= 2 || countBelow >= 2) 
                    reasons.push("Rule 5: 3點中2點在2σ外");
            }
            
            // Rule 6: 連續5點中有4點落在1σ外
            if (i >= 4) {
                let last5 = data.slice(i-4, i+1);
                let count = last5.filter(v => v > sigma1_above || v < sigma1_below).length;
                if (count >= 4) reasons.push("Rule 6: 5點中4點在1σ外");
            }
            
            // Rule 7: 連續15點在1σ内
            if (i >= 14) {
                let last15 = data.slice(i-14, i+1);
                if (last15.every(v => v >= sigma1_below && v <= sigma1_above)) 
                    reasons.push("Rule 7: 連續15點在1σ内");
            }
            
            // Rule 8: 連續8點在中心線兩側但都不在1σ内
            if (i >= 7) {
                let last8 = data.slice(i-7, i+1);
                let allOutside1Sigma = last8.every(v => v > sigma1_above || v < sigma1_below);
                let hasAbove = last8.some(v => v > sigma1_above);
                let hasBelow = last8.some(v => v < sigma1_below);
                if (allOutside1Sigma && hasAbove && hasBelow) {
                    reasons.push("Rule 8: 8點在1σ外且兩側");
                }
            }
            
            if (reasons.length > 0) { 
                statuses[i] = "violation"; 
                violations.push({ label: labels[i], reasons: reasons }); 
            }
        }
        return { statuses, violations };
    }

    function updateStatistics(data, statuses) {
        const sorted = [...data].sort((a, b) => a - b);
        const count = data.length;
        const mean = data.reduce((a, b) => a + b, 0) / count;
        const median = count % 2 === 0 
            ? (sorted[count/2 - 1] + sorted[count/2]) / 2 
            : sorted[Math.floor(count/2)];
        const min = sorted[0];
        const max = sorted[count - 1];
        const range = max - min;
        const variance = data.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / count;
        const stdDev = Math.sqrt(variance);
        const violations = statuses.filter(s => s === 'violation').length;

        document.getElementById('statCount').textContent = count;
        document.getElementById('statMean').textContent = mean.toFixed(3);
        document.getElementById('statMedian').textContent = median.toFixed(3);
        document.getElementById('statStd').textContent = stdDev.toFixed(3);
        document.getElementById('statMin').textContent = min.toFixed(3);
        document.getElementById('statMax').textContent = max.toFixed(3);
        document.getElementById('statRange').textContent = range.toFixed(3);
        document.getElementById('statViolations').textContent = violations;
        
        // 根據標準差設置顏色
        const stdEl = document.getElementById('statStd');
        const sigmaRange = (max - min) / 6;
        if (stdDev > sigmaRange * 1.5) {
            stdEl.classList.add('danger');
            stdEl.classList.remove('warning', 'success');
        } else if (stdDev > sigmaRange) {
            stdEl.classList.add('warning');
            stdEl.classList.remove('danger', 'success');
        } else {
            stdEl.classList.add('success');
            stdEl.classList.remove('warning', 'danger');
        }

        // 異常點數設置顏色
        const violEl = document.getElementById('statViolations');
        const violRate = violations / count;
        if (violRate > 0.1) {
            violEl.classList.add('danger');
            violEl.classList.remove('warning', 'success');
        } else if (violRate > 0.05) {
            violEl.classList.add('warning');
            violEl.classList.remove('danger', 'success');
        } else {
            violEl.classList.add('success');
            violEl.classList.remove('warning', 'danger');
        }
    }

    function updateAnalysis(data, cl, ucl, lcl, analysis) {
        const content = document.getElementById('analysisContent');
        const items = [];
        const sigma = (ucl - cl) / 3;
        const mean = data.reduce((a, b) => a + b, 0) / data.length;

        // 1. 趨勢分析
        let increasing = 0, decreasing = 0;
        for (let i = 1; i < data.length; i++) {
            if (data[i] > data[i-1]) increasing++;
            else if (data[i] < data[i-1]) decreasing++;
        }
        const trendRate = Math.abs(increasing - decreasing) / (data.length - 1);
        if (trendRate > 0.6) {
            items.push({
                type: 'warning',
                icon: '📈',
                title: '趨勢明顯',
                desc: increasing > decreasing ? `數據呈現上升趨勢 (${Math.round(trendRate * 100)}%)` : `數據呈現下降趨勢 (${Math.round(trendRate * 100)}%)`
            });
        } else {
            items.push({
                type: 'success',
                icon: '📊',
                title: '趨勢穩定',
                desc: '數據變動平穩，無明顯趨勢'
            });
        }

        // 2. 分散度分析
        const cv = (sigma / Math.abs(mean)) * 100;
        if (cv > 10) {
            items.push({
                type: 'warning',
                icon: '📏',
                title: '變異係數偏高',
                desc: `CV = ${cv.toFixed(1)}%，數據分散度較大`
            });
        } else if (cv > 5) {
            items.push({
                type: 'info',
                icon: '📏',
                title: '變異係數正常',
                desc: `CV = ${cv.toFixed(1)}%，數據分散度正常`
            });
        } else {
            items.push({
                type: 'success',
                icon: '✅',
                title: '變異係數優良',
                desc: `CV = ${cv.toFixed(1)}%，數據集中度高`
            });
        }

        // 3. 離群值檢測
        const q1 = data.sort((a, b) => a - b)[Math.floor(data.length * 0.25)];
        const q3 = data.sort((a, b) => a - b)[Math.floor(data.length * 0.75)];
        const iqr = q3 - q1;
        const outliers = data.filter(v => v < q1 - 1.5 * iqr || v > q3 + 1.5 * iqr);
        if (outliers.length > 0) {
            items.push({
                type: 'warning',
                icon: '⚠️',
                title: '發現離群值',
                desc: `檢測到 ${outliers.length} 個潛在離群值，建議檢查`
            });
        } else {
            items.push({
                type: 'success',
                icon: '✅',
                title: '無離群值',
                desc: '未檢測到明顯離群值'
            });
        }

        // 4. 製程穩定性
        const violationRate = analysis.statuses.filter(s => s === 'violation').length / data.length;
        if (violationRate === 0) {
            items.push({
                type: 'success',
                icon: '🎯',
                title: '製程穩定',
                desc: '所有數據點都在控制範圍內，製程穩定'
            });
        } else if (violationRate < 0.05) {
            items.push({
                type: 'warning',
                icon: '⚠️',
                title: '製程基本穩定',
                desc: `有 ${Math.round(violationRate * 100)}% 的數據點超出控制範圍`
            });
        } else {
            items.push({
                type: 'warning',
                icon: '🚨',
                title: '製程不穩定',
                desc: `有 ${Math.round(violationRate * 100)}% 的數據點超出控制範圍，需要改善`
            });
        }

        content.innerHTML = items.map(item => `
            <div class="analysis-item ${item.type}">
                <div class="analysis-icon">${item.icon}</div>
                <div class="analysis-text">
                    <div class="analysis-title">${item.title}</div>
                    <div class="analysis-desc">${item.desc}</div>
                </div>
            </div>
        `).join('');
    }

        }

        const list = document.getElementById('alarm-list');

        } else {
            panel.style.display = 'none'; panel.classList.remove('open');
        }

        // 更新統計摘要
        updateStatistics(d.avgs, analysis.statuses);

        // 更新數據分析
        updateAnalysis(d.avgs, d.x_cl, d.x_ucl, d.x_lcl, analysis);

        const pointColors = analysis.statuses.map(s => s === "violation" ? '#ff0000' : '#3498db');
        const pointRadius = analysis.statuses.map(s => s === "violation" ? 8 : 4);

        if (chartX) chartX.destroy();
        if (chartR) chartR.destroy();

        // 獲取當前索引的異常原因
        const getViolationReasons = (idx) => {
            // 確保 idx 在有效範圍內
            if (idx < 0 || idx >= d.labels.length) {
                return [];
            }
            const matching = analysis.violations.filter(v => v.label === d.labels[idx]);
            if (matching.length > 0) {
                return matching.map(v => v.reasons).flat();
            }
            return [];
        };

        // 自定義工具提示函數
        const getTooltipTitle = (context) => {
            // 檢查 context 是否有效
            if (!context || !context[0]) {
                return '';
            }
            
            const idx = context[0].dataIndex;
            const id = d.ids && d.ids[idx] ? d.ids[idx] : 'N/A';
            const date = d.dates && d.dates[idx] ? d.dates[idx].split(' ')[0] : '';
            const avg = d.avgs && d.avgs[idx] ? d.avgs[idx].toFixed(3) : 'N/A';
            
            return `ID: ${id} ${date ? '(' + date + ')' : ''} [X̄: ${avg}]`;
        };

        // 獲取完整的標籤內容（包含異常資訊）
        const getFullLabel = (context) => {
            if (!context || !context.dataset) {
                return '';
            }
            let label = context.dataset.label || '';
            if (label) label += ': ';
            
            // 優先使用 d.avgs 來顯示（確保數值正確）
            if (context.dataIndex !== undefined && d.avgs && d.avgs[context.dataIndex] !== undefined) {
                label += d.avgs[context.dataIndex].toFixed(3);
            } else if (context.parsed?.y !== null && context.parsed?.y !== undefined) {
                label += context.parsed.y.toFixed(3);
            } else if (context.raw !== undefined) {
                label += context.raw.toFixed(3);
            }
            return label;
        };

        // 獲取異常原因標籤
        const getViolationLabel = (idx) => {
            // 確保 idx 有效
            if (idx === undefined || idx < 0 || idx >= d.avgs.length) {
                return [];
            }
            const reasons = getViolationReasons(idx);
            if (reasons.length > 0) {
                return [{ indicator: '⚠️', text: '異常: ' + reasons.join('、') }];
            }
            return [];
        };

        // 共同的 hover 處理器 - 同步兩張圖
        const syncHover = (chart, index) => {
            // 確保 index 有效
            if (index < 0 || index >= d.avgs.length) {
                return;
            }
            if (chart === chartX && chartR) {
                chartR.tooltip.setActiveElements([
                    { datasetIndex: 0, index: index }
                ]);
                chartR.update('none');
            } else if (chart === chartR && chartX) {
                chartX.tooltip.setActiveElements([
                    { datasetIndex: 0, index: index }
                ]);
                chartX.update('none');
            }
        };

        // 共同的點擊處理器 - 跳轉到編輯頁面
        const handlePointClick = (event, elements, chart) => {
            if (elements.length > 0) {
                const idx = elements[0].index;
                // 確保 idx 有效
                if (idx < 0 || idx >= d.ids.length) {
                    return;
                }
                const id = d.ids[idx];
                if (id) {
                    // 跳轉到編輯頁面並載入該筆資料
                    window.location.href = `index.html?edit_id=${id}`;
                }
            }
        };

        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            onClick: (e, elements, chart) => handlePointClick(e, elements, chart),
            plugins: {
                    tooltip: {
                        filter: function(tooltipItem) {
                            // 只顯示主要數據集的 tooltip
                            return tooltipItem.datasetIndex === 0;
                        },
                        callbacks: {
                            title: getTooltipTitle,
                            label: function(context) {
                                const lines = [getFullLabel(context)];
                                // 添加異常原因
                                const violationLines = getViolationLabel(context.dataIndex);
                                return lines.concat(violationLines.map(v => `${v.indicator} ${v.text}`));
                            }
                        }
                    }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: '日期'
                    },
                    ticks: {
                        maxRotation: 45,
                        minRotation: 0,
                        autoSkip: true,
                        maxTicksLimit: 20
                    }
                }
            }
        };

        chartX = new Chart(document.getElementById('xBarChart'), {
            type: 'line',
            data: {
                labels: d.dates && d.dates.some(d => d) ? d.dates : d.labels,
                datasets: [
                    {
                        label: '平均值',
                        data: d.avgs,
                        borderColor: '#3498db',
                        backgroundColor: pointColors,
                        pointRadius: pointRadius,
                        tension: 0.1,
                        fill: false,
                        pointHoverRadius: 8,
                        pointHoverBackgroundColor: pointColors,
                        order: 1
                    },
                    { label: 'UCL', data: Array(d.labels.length).fill(d.x_ucl), borderColor: 'red', borderDash: [5,5], pointRadius:0, order: 2 },
                    { label: 'CL', data: Array(d.labels.length).fill(d.x_cl), borderColor: 'green', pointRadius:0, order: 3 },
                    { label: 'LCL', data: Array(d.labels.length).fill(d.x_lcl), borderColor: 'red', borderDash: [5,5], pointRadius:0, order: 4 }
                ]
            },
            options: {
                ...commonOptions,
                plugins: {
                    ...commonOptions.plugins,
                    title: { display: true, text: 'X-bar 管制圖 (點擊資料點可編輯)' },
                    legend: {
                        labels: {
                            filter: function(item, chart) {
                                return item.text !== 'UCL' && item.text !== 'LCL';
                            }
                        }
                    }
                },
                onHover: (event, elements) => {
                    if (elements.length > 0) {
                        syncHover(chartX, elements[0].index);
                    }
                }
            }
        });

        // R圖表專用的tooltip回調函數
        const getRTooltipTitle = (context) => {
            if (!context || !context[0]) {
                return '';
            }
            const idx = context[0].dataIndex;
            const id = d.ids && d.ids[idx] ? d.ids[idx] : 'N/A';
            const date = d.dates && d.dates[idx] ? d.dates[idx].split(' ')[0] : '';
            const range = d.ranges && d.ranges[idx] ? d.ranges[idx].toFixed(3) : 'N/A';
            return `ID: ${id} ${date ? '(' + date + ')' : ''} [R: ${range}]`;
        };

        // R圖表專用的label回調函數
        const getRFullLabel = (context) => {
            if (!context || !context.dataset) {
                return '';
            }
            let label = context.dataset.label || '';
            if (label) label += ': ';
            
            // 使用 d.ranges 來顯示R值
            if (context.dataIndex !== undefined && d.ranges && d.ranges[context.dataIndex] !== undefined) {
                label += d.ranges[context.dataIndex].toFixed(3);
            } else if (context.parsed?.y !== null && context.parsed?.y !== undefined) {
                label += context.parsed.y.toFixed(3);
            } else if (context.raw !== undefined) {
                label += context.raw.toFixed(3);
            }
            return label;
        };

        chartR = new Chart(document.getElementById('rChart'), {
            type: 'line',
            data: {
                labels: d.dates && d.dates.some(d => d) ? d.dates : d.labels,
                datasets: [
                    {
                        label: '全距 R',
                        data: d.ranges,
                        borderColor: '#f39c12',
                        backgroundColor: '#f39c12',
                        tension: 0.1,
                        fill: false,
                        pointHoverRadius: 8,
                        pointHoverBackgroundColor: analysis.statuses.map(s => s === "violation" ? '#ff0000' : '#f39c12'),
                        order: 1
                    },
                    { label: 'UCL', data: Array(d.labels.length).fill(d.r_ucl), borderColor: 'red', borderDash: [5,5], pointRadius:0, order: 2 }
                ]
            },
            options: {
                ...commonOptions,
                plugins: {
                    ...commonOptions.plugins,
                    title: { display: true, text: 'R 管制圖 (點擊資料點可編輯)' },
                    tooltip: {
                        filter: function(tooltipItem) {
                            // 只顯示主要數據集的 tooltip
                            return tooltipItem.datasetIndex === 0;
                        },
                        callbacks: {
                            title: getRTooltipTitle,
                            label: function(context) {
                                const lines = [getRFullLabel(context)];
                                // 添加異常原因
                                const violationLines = getViolationLabel(context.dataIndex);
                                return lines.concat(violationLines.map(v => `${v.indicator} ${v.text}`));
                            }

                    legend: {

                                return item.text !== 'UCL';
                            }
                        }
                    }
                },
                onHover: (event, elements) => {
                    if (elements.length > 0) {
                        syncHover(chartR, elements[0].index);
                    }
                }
            }
        });
    }

    async function handleImport() {
        const file = document.getElementById('importFile').files[0];
        if (!file) return alert("請先選擇檔案");

        const formData = new FormData();
        formData.append('file', file);

        const headers = {};
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

        try {
            const res = await fetch(`${API_BASE}/api/import`, {
                    method: 'POST',
                    body: formData,
                    headers: headers
                });
            if (res.ok) {
                alert("匯入成功");
                refreshAll();
            } else {
                const error = await res.json();
                alert(error.error || "匯入失敗");
            }
        } catch (err) {
            alert("匯入失敗：" + err.message);
        }
    }

    function handleExport() {
        const v = document.getElementById('f-vendor').value;
        const m = document.getElementById('f-material').value;
        const s = document.getElementById('f-spec').value;
        const sd = document.getElementById('f-start').value;
        const ed = document.getElementById('f-end').value;
        window.location.href = `${API_BASE}/api/export/excel?vendor=${v}&material=${m}&spec=${s}&start_date=${sd}&end_date=${ed}&token=${authToken}`;
    }

    document.getElementById('importFile').addEventListener('change', function(e) {
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const label = document.querySelector('.file-upload-label span');
        if (this.files && this.files[0]) {
            fileNameDisplay.textContent = `✓ ${this.files[0].name}`;
            fileNameDisplay.classList.add('has-file');
            label.textContent = '📁 已選擇檔案 (點擊更換)';
        } else {
            fileNameDisplay.textContent = '尚未選擇檔案';
            fileNameDisplay.classList.remove('has-file');
            label.textContent = '📁 點擊選擇檔案';
        }
    });
</script>
</body>
</html>
