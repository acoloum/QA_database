<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者管理 - 品保系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .container {
            max-width: 500px;
        }
        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .card-header h2 {
            margin: 0;
            font-weight: bold;
        }
        .card-body {
            padding: 30px;
        }
        .form-floating label {
            color: #666;
        }
        .form-floating input:focus ~ label {
            color: #6a11cb;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 10px;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover {
            color: #fff;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left me-2"></i>返回登入頁面
        </a>
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-user-plus me-2"></i>建立新使用者</h2>
            </div>
            <div class="card-body">
                <div id="message" class="alert d-none"></div>
                <form id="userForm">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="使用者名稱" required>
                        <label for="username"><i class="fa-solid fa-user me-2"></i>使用者名稱</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" placeholder="密碼" required>
                        <label for="password"><i class="fa-solid fa-lock me-2"></i>密碼</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="確認密碼" required>
                        <label for="confirmPassword"><i class="fa-solid fa-lock me-2"></i>確認密碼</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-check me-2"></i>建立使用者
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        console.log('API_BASE:', API_BASE); 
        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('密碼不一致', 'danger');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    showMessage('✓ 使用者建立成功！', 'success');
                    document.getElementById('userForm').reset();
                } else {
                    showMessage('✗ ' + (data.error || '建立失敗'), 'danger');
                }
            } catch (err) {
                showMessage('✗ 連線錯誤：' + err.message, 'danger');
            }
        });

        function showMessage(msg, type) {
            const alert = document.getElementById('message');
            alert.textContent = msg;
            alert.className = `alert alert-${type}`;
            alert.classList.remove('d-none');
            setTimeout(() => {
                alert.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
