version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: qc-database-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swordfish1}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d qa_database" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # QC System (Frontend + Backend)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc-database-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: qa_database
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-swordfish1}
      SECRET_KEY: ${SECRET_KEY:-qa-inspection-system-2026-secure-key-a7b9c3d5e1f2g4h6}
    ports:
      - "8080:80"
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
