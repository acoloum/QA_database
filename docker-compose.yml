version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    # 對齊正式環境使用的 PostgreSQL 18。
    # 掛載點是 /var/lib/postgresql 而非底下的 data：官方映像自 18 起把
    # PGDATA 改成版本專屬路徑（/var/lib/postgresql/18/docker），掛在舊的
    # /var/lib/postgresql/data 會讓資料落在 volume 之外，容器一重建就消失。
    # 既有的 16 資料卷無法直接沿用，升級步驟見
    # docs/migrations/postgres-16-to-18-compose-upgrade.md。
    image: postgres:18-alpine
    container_name: qc-database-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # 這組 initdb 參數決定排序規則，換卷重建時必須完全一致，
      # 否則索引順序與字串比較行為會與舊庫不同。
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d qa_database" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # QC System (Frontend + Backend)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc-database-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: qa_database
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MAX_CONTENT_LENGTH: 10485760
      TRUSTED_PROXY_COUNT: 1
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    ports:
      - "8080:80"
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/backend/uploads

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local
