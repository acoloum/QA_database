version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: qa_db
    environment:
      POSTGRES_DB: qa_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swordfish1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qa_backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=qa_database
      - DB_USER=postgres
      - DB_PASSWORD=swordfish1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./config.py:/app/config.py

  # React Frontend + Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
