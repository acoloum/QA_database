limit_req_zone $binary_remote_addr zone=qc_api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Frontend - Serve React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # 瀏覽器安全防線；目前僅提供 HTTP，因此不設定 HSTS。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # 後端也會加相同 headers；代理時隱藏上游值，避免瀏覽器收到重複欄位。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API requests -> proxy to Flask backend
    location /api/ {
        # 代理層先擋突發請求，Flask 限流再依可信任的 client IP 做細緻控制。
        limit_req zone=qc_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # 與 Flask MAX_CONTENT_LENGTH 一致，避免代理層放行超大請求。
        client_max_body_size 10M;
    }

    # Swagger API docs
    location /apidocs/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /flasgger_static/ {
        proxy_pass http://127.0.0.1:5001;
    }

    location /apispec_1.json {
        proxy_pass http://127.0.0.1:5001;
    }

    # React SPA - all other routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 內有 add_header 時不繼承 server 層設定，故需明確保留安全 headers。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
