<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品保管理系統 - 入口</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .system-title {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 3px 3px 0px #6a11cb;
            margin-bottom: 4rem;
        }

        .nav-card {
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-radius: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 0px rgba(0, 0, 0, 0.05);
            height: 100%;
            padding: 20px;
        }

        .nav-card:hover {
            transform: translateY(-20px) scale(1.05);
            background: #ffffff;
            box-shadow: 0 30px 0px rgba(0, 0, 0, 0.1);
        }

        /* 登入表單樣式 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        .login-title {
            color: #6a11cb;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 0.2rem rgba(106, 17, 203, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            width: 100%;
            transition: transform 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.3);
            color: white;
        }

        /* 像泡泡一樣的圖示容器 */
        .icon-bubble {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-radius: 50% 20% 50% 20%;
            transition: 0.5s;
            animation: bubble-float 4s ease-in-out infinite;
        }

        /* 色彩方案 */
        .bg-shipping {
            background: #ff9a9e;
            color: white;
            border: 5px solid #fff;
        }

        .bg-patrol {
            background: #a18cd1;
            color: white;
            border: 5px solid #fff;
        }

        @keyframes bubble-float {

            0%,
            100% {
                border-radius: 50% 20% 50% 20%;
                transform: translateY(0);
            }

            50% {
                border-radius: 20% 50% 20% 50%;
                transform: translateY(-15px);
            }
        }

        .card-title {
            color: #444;
            font-weight: 800;
            font-size: 1.8rem;
            margin-top: 15px;
        }

        .description {
            background: #f0f0f0;
            border-radius: 15px;
            padding: 10px;
            color: #777;
            font-weight: bold;
        }

        /* 可愛的小裝飾 */
        .card-body::after {
            content: '✨';
            display: block;
            font-size: 1.5rem;
            margin-top: 10px;
            opacity: 0;
            transition: 0.3s;
        }

        .nav-card:hover .card-body::after {
            opacity: 1;
            transform: scale(1.2);
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #6a11cb;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: scale(1.1);
            background: white;
        }
    </style>
</head>

<body>
    <!-- 登入頁面 -->
    <div id="loginPage" class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-shield fa-3x" style="color: #6a11cb;"></i>
            </div>
            <h2 class="login-title">品保管理系統</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">使用者名稱</label>
                    <input type="text" class="form-control" id="username" required placeholder="請輸入使用者名稱">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="password" required placeholder="請輸入密碼">
                </div>
                <button type="submit" class="btn btn-login">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>登入
                </button>
            </form>
            <p id="loginError" class="text-danger mt-3 text-center small hidden"></p>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="mainPage" class="container text-center hidden">
        <button class="logout-btn" onclick="handleLogout()" title="登出">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
        <h1 class="system-title">✨ 品質小管家 ✨</h1>
        <div class="row justify-content-center g-5">

            <div class="col-md-5 col-lg-4" onclick="location.href='shipping.html'">
                <div class="card nav-card">
                    <div class="icon-bubble bg-shipping">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">出貨檢驗</h3>
                        <p class="description">把最棒的產品交給客戶吧！</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='patrol.html'">
                <div class="card nav-card">
                    <div class="icon-bubble bg-patrol">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">現場巡檢</h3>
                        <p class="description">巡視現場，變出完美品質！</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='ncmr.html'">
                <div class="card nav-card">
                    <div class="icon-bubble" style="background: #ff9a9e; color: white; border: 5px solid #fff;">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">不合格品</h3>
                        <p class="description">異常快走開！攔截不良品</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='capa.html'">
                <div class="card nav-card">
                    <div class="icon-bubble" style="background: #a18cd1; color: white; border: 5px solid #fff;">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">矯正措施與預防體系 (CAPA)</h3>
                        <p class="description">8D 報告，問題不再來</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='cara.html'">
                <div class="card nav-card">
                    <div class="icon-bubble" style="background: #4facfe; color: white; border: 5px solid #fff;">
                        <i class="fa-solid fa-clipboard-check"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">糾正措施報告 (CAR)</h3>
                        <p class="description">追蹤矯正，確保有效性</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='rework.html'">
                <div class="card nav-card">
                    <div class="icon-bubble" style="background: #ff9a9e; color: white; border: 5px solid #fff;">
                        <i class="fa-solid fa-rotate"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">重工管理</h3>
                        <p class="description">重工追蹤，品質復活</p>
                    </div>
                </div>
            </div>

            <div class="col-md-5 col-lg-4" onclick="location.href='tolerance.html'">
                <div class="card nav-card">
                    <div class="icon-bubble" style="background: #43e97b; color: white; border: 5px solid #fff;">
                        <i class="fa-solid fa-ruler-combined"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">廠商公差管理</h3>
                        <p class="description">公差標準，一目了然</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:'
            ? 'http://localhost:5001'
            : `${window.location.protocol}//${(window.location.hostname || 'localhost')}:${window.location.port || '5000'}`;
        console.log('API_BASE:', API_BASE);

        // 驗證 Token 是否有效
        async function verifyToken(token) {
            try {
                const res = await fetch(`${API_BASE}/api/verify-token`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                return res.ok && (await res.json()).valid;
            } catch {
                return false;
            }
        }

        window.onload = async function () {
            const token = localStorage.getItem('authToken');
            if (token) {
                // 驗證 token 是否有效
                const isValid = await verifyToken(token);
                if (isValid) {
                    showMainPage();
                } else {
                    // Token 無效，清除並停留在登入頁面
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('username');
                    console.log('Token 已過期，請重新登入');
                }
            }
            // 檢查是否有 edit_id 參數，有的話直接跳轉到出貨檢驗頁面
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit_id');
            if (editId) {
                window.location.href = `shipping.html?edit_id=${editId}`;
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('username', data.username);
                    showMainPage();
                } else {
                    document.getElementById('loginError').textContent = data.error || '登入失敗';
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('loginError').textContent = '連線錯誤，請稍後再試';
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        function showMainPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
        }
    </script>
</body>

</html>
