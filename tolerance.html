<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠商公差管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .search-section {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-add {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 14px 28px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
        }

        thead th {
            padding: 16px;
            color: white;
            font-weight: 600;
            text-align: left;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tbody td {
            padding: 14px 16px;
            color: #374151;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-icon {
            padding: 8px 12px;
            font-size: 13px;
        }

        .btn-view {
            background: #3b82f6;
            color: white;
            margin-right: 6px;
        }

        .btn-view:hover {
            background: #2563eb;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            margin-right: 6px;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Modal 樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 1200px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
        }

        .details-section {
            margin-top: 30px;
            border-top: 2px solid #e5e7eb;
            padding-top: 25px;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .details-header h3 {
            font-size: 18px;
            color: #1f2937;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .details-table th {
            background: #f3f4f6;
            padding: 12px;
            border: 1px solid #d1d5db;
            font-weight: 600;
            text-align: left;
        }

        .details-table td {
            padding: 10px;
            border: 1px solid #e5e7eb;
        }

        .details-table input,
        .details-table select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .btn-remove-row {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 2px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 18px;
        }

        .import-export {
            display: flex;
            gap: 12px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .view-modal .modal-body {
            background: #f9fafb;
        }

        .info-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .info-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .info-value {
            font-size: 15px;
            color: #1f2937;
        }

        /* 分頁樣式 */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .pagination-info {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            background: #f3f4f6;
            border-color: #0ea5e9;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            color: white;
            border-color: #0ea5e9;
        }

        .page-info {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-weight: 600;
            color: #1f2937;
        }

        /* 響應式設計 - 手機和平板適配 */
        @media (max-width: 992px) {
            .search-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .info-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px !important;
            }

            .container {
                padding: 15px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .search-grid {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .info-row {
                grid-template-columns: 1fr;
            }

            .action-bar {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .import-export {
                flex-direction: column;
            }

            .file-input-wrapper, .file-input-label, .import-export .btn {
                width: 100%;
                justify-content: center;
            }

            .pagination {
                flex-direction: column;
                gap: 15px;
            }
            
            .pagination-controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .modal-content {
                width: 95%;
                margin: 10px;
            }
            
            .modal-header {
                padding: 15px 20px;
            }
            
            .modal-body {
                padding: 15px;
            }
            
            .modal-footer {
                padding: 15px 20px;
            }
        }

        @media (max-width: 576px) {
            .back-btn {
                padding: 8px 15px;
                font-size: 14px;
            }
            
            table {
                font-size: 12px;
            }
            
            .btn {
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-ruler-combined"></i> 廠商公差管理系統</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首頁</a>
        </div>

        <!-- 查詢區 -->
        <div class="search-section">
            <div class="search-grid">
                <div class="form-group">
                    <label><i class="fas fa-flask"></i> 材質</label>
                    <input type="text" id="searchMaterial" placeholder="請輸入材質 (如: 6066-T6)">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-industry"></i> 廠商</label>
                    <select id="searchVendor">
                        <option value="">-- 全部廠商 --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-cog"></i> 規格</label>
                    <input type="text" id="searchSpec" placeholder="請輸入規格">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="searchTolerance()" style="width: 100%;">
                        <i class="fas fa-search"></i> 查詢
                    </button>
                </div>
            </div>
        </div>

        <!-- 操作列 -->
        <div class="action-bar">
            <button class="btn btn-add" onclick="openAddModal()">
                <i class="fas fa-plus-circle"></i> 新增公差資料
            </button>
            <div class="import-export">
                <div class="file-input-wrapper">
                    <input type="file" id="importFile" accept=".xlsx,.xls" onchange="handleImport()">
                    <label for="importFile" class="file-input-label">
                        <i class="fas fa-file-upload"></i> 匯入 Excel
                    </label>
                </div>
                <button class="btn btn-success" onclick="handleExport()">
                    <i class="fas fa-file-download"></i> 匯出 Excel
                </button>
            </div>
        </div>

        <!-- 資料表格 -->
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>材質</th>
                        <th>規格</th>
                        <th>廠商</th>
                        <th>建立日期</th>
                        <th style="width: 280px; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 動態載入 -->
                </tbody>
            </table>
        </div>

        <!-- 分頁控制 -->
        <div class="pagination" id="paginationContainer" style="display: none;">
            <div class="pagination-info">
                顯示第 <span id="pageStart">0</span>-<span id="pageEnd">0</span> 筆，共 <span id="totalRecords">0</span> 筆
            </div>
            <div class="pagination-controls">
                <button class="page-btn" onclick="goToPage(1)" id="firstPageBtn">
                    <i class="fas fa-angle-double-left"></i> 首頁
                </button>
                <button class="page-btn" onclick="goToPage(currentPage - 1)" id="prevPageBtn">
                    <i class="fas fa-angle-left"></i> 上一頁
                </button>
                <div class="page-info">
                    第 <span id="currentPageSpan">1</span> 頁，共 <span id="totalPagesSpan">1</span> 頁
                </div>
                <button class="page-btn" onclick="goToPage(currentPage + 1)" id="nextPageBtn">
                    下一頁 <i class="fas fa-angle-right"></i>
                </button>
                <button class="page-btn" onclick="goToPage(totalPages)" id="lastPageBtn">
                    末頁 <i class="fas fa-angle-double-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯 Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-edit"></i> 新增公差資料</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-flask"></i> 材質 <span style="color: red;">*</span></label>
                        <input type="text" id="inputMaterial" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-cog"></i> 規格</label>
                        <input type="text" id="inputSpec">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-industry"></i> 廠商</label>
                        <select id="inputVendor">
                            <option value="">-- 請選擇 --</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> 備註</label>
                    <input type="text" id="inputRemark">
                </div>

                <div class="details-section">
                    <div class="details-header">
                        <h3><i class="fas fa-list"></i> 公差明細</h3>
                        <button class="btn btn-primary btn-icon" onclick="addDetailRow()">
                            <i class="fas fa-plus"></i> 新增明細
                        </button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th style="width: 150px;">測量項目</th>
                                    <th style="width: 120px;">測量位置</th>
                                    <th style="width: 110px;">尺寸下限</th>
                                    <th style="width: 110px;">尺寸上限</th>
                                    <th style="width: 110px;">公差下限</th>
                                    <th style="width: 110px;">公差上限</th>
                                    <th style="width: 100px;">標準值</th>
                                    <th style="width: 80px;">單位</th>
                                    <th style="width: 150px;">備註</th>
                                    <th style="width: 80px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="detailsTableBody">
                                <!-- 動態載入明細 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button class="btn btn-success" onclick="saveData()">
                    <i class="fas fa-save"></i> 儲存
                </button>
            </div>
        </div>
    </div>

    <!-- 查看詳情 Modal -->
    <div id="viewModal" class="modal view-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-eye"></i> 公差詳情</h2>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="info-card">
                    <h3 style="margin-bottom: 15px; color: #1f2937; font-size: 18px;">基本資訊</h3>
                    <div class="info-row">
                        <div class="info-item">
                            <span class="info-label">材質</span>
                            <span class="info-value" id="viewMaterial">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">規格</span>
                            <span class="info-value" id="viewSpec">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">廠商</span>
                            <span class="info-value" id="viewVendor">-</span>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-item">
                            <span class="info-label">建立日期</span>
                            <span class="info-value" id="viewCreateDate">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">備註</span>
                            <span class="info-value" id="viewRemark">-</span>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <h3 style="margin-bottom: 15px; color: #1f2937; font-size: 18px;">公差明細</h3>
                    <div style="overflow-x: auto;">
                        <table class="details-table">
                            <thead>
                                <tr>
                                    <th>測量項目</th>
                                    <th>測量位置</th>
                                    <th>尺寸下限</th>
                                    <th>尺寸上限</th>
                                    <th>公差下限</th>
                                    <th>公差上限</th>
                                    <th>標準值</th>
                                    <th>單位</th>
                                    <th>備註</th>
                                </tr>
                            </thead>
                            <tbody id="viewDetailsBody">
                                <!-- 動態載入 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeViewModal()">
                    <i class="fas fa-times"></i> 關閉
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:'
            ? 'http://localhost:5001'
            : `${window.location.protocol}//${window.location.hostname}:${window.location.port || '5000'}`;

        let authToken = localStorage.getItem('authToken') || '';
        let currentEditId = null;
        let vendorList = [];

        // 分頁變數
        let currentPage = 1;
        let pageSize = 20;
        let totalPages = 1;
        let totalRecords = 0;

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
            return headers;
        }

        async function fetchWithAuth(url, options = {}) {
            if (!options.headers) options.headers = {};
            Object.assign(options.headers, getAuthHeaders());
            const res = await fetch(url, options);
            if (res.status === 401) {
                alert('認證失效，請重新登入');
                localStorage.removeItem('authToken');
                location.href = 'index.html';
            }
            return res;
        }

        // 輔助函數：正確顯示數值（包括 0）
        function displayValue(val) {
            if (val === null || val === undefined || val === '') {
                return '-';
            }
            return val;
        }

        // 初始化
        window.onload = async () => {
            await loadOptions();
            await searchTolerance();
        };

        // 載入選項
        async function loadOptions() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/options`);
                const data = await res.json();

                vendorList = data.vendors || [];
                const vendorSelect = document.getElementById('searchVendor');
                const inputVendorSelect = document.getElementById('inputVendor');

                vendorList.forEach(v => {
                    vendorSelect.innerHTML += `<option value="${v.id}">${v.name}</option>`;
                    inputVendorSelect.innerHTML += `<option value="${v.id}">${v.name}</option>`;
                });
            } catch (e) {
                console.error('載入選項失敗:', e);
            }
        }

        // 查詢公差
        async function searchTolerance(page = 1) {
            currentPage = page;
            const material = document.getElementById('searchMaterial').value;
            const vendorId = document.getElementById('searchVendor').value;
            const spec = document.getElementById('searchSpec').value;

            const params = new URLSearchParams();
            if (material) params.append('material', material);
            if (vendorId) params.append('vendor_id', vendorId);
            if (spec) params.append('spec', spec);
            params.append('page', currentPage);
            params.append('page_size', pageSize);

            try {
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/search?${params}`);
                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '查詢失敗');
                    return;
                }

                // 更新分頁資訊
                totalRecords = result.total;
                totalPages = result.total_pages;
                currentPage = result.page;

                renderTable(result.data);
                updatePagination();
            } catch (e) {
                console.error('查詢失敗:', e);
                alert('查詢失敗');
            }
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');

            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>暫無資料</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.識別碼}</td>
                    <td><span class="badge badge-primary">${item.材質 || '-'}</span></td>
                    <td>${item.規格 || '-'}</td>
                    <td>${item.廠商名稱 || '-'}</td>
                    <td>${item.建立日期 || '-'}</td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button class="btn btn-icon btn-view" onclick="viewDetail(${item.識別碼})">
                            <i class="fas fa-eye"></i> 查看
                        </button>
                        <button class="btn btn-icon btn-edit" onclick="editData(${item.識別碼})">
                            <i class="fas fa-edit"></i> 編輯
                        </button>
                        <button class="btn btn-icon btn-delete" onclick="deleteData(${item.識別碼})">
                            <i class="fas fa-trash"></i> 刪除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 開啟新增 Modal
        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> 新增公差資料';
            document.getElementById('inputMaterial').value = '';
            document.getElementById('inputSpec').value = '';
            document.getElementById('inputVendor').value = '';
            document.getElementById('inputRemark').value = '';
            document.getElementById('detailsTableBody').innerHTML = '';
            addDetailRow();
            document.getElementById('editModal').classList.add('show');
        }

        // 關閉編輯 Modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        // 新增明細行
        function addDetailRow() {
            const tbody = document.getElementById('detailsTableBody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="detail-item" placeholder="例: 外徑"></td>
                <td><input type="text" class="detail-position" placeholder="例: 1"></td>
                <td><input type="number" step="0.0001" class="detail-size-min"></td>
                <td><input type="number" step="0.0001" class="detail-size-max"></td>
                <td><input type="number" step="0.0001" class="detail-tol-min"></td>
                <td><input type="number" step="0.0001" class="detail-tol-max"></td>
                <td><input type="number" step="0.0001" class="detail-std"></td>
                <td><input type="text" class="detail-unit" value="mm"></td>
                <td><input type="text" class="detail-remark"></td>
                <td><button class="btn btn-icon btn-remove-row" onclick="removeDetailRow(this)"><i class="fas fa-trash"></i></button></td>
            `;
            tbody.appendChild(row);
        }

        // 移除明細行
        function removeDetailRow(btn) {
            btn.closest('tr').remove();
        }

        // 儲存資料
        async function saveData() {
            const material = document.getElementById('inputMaterial').value.trim();
            if (!material) {
                alert('請輸入材質');
                return;
            }

            const spec = document.getElementById('inputSpec').value.trim();
            const vendorId = document.getElementById('inputVendor').value;
            const remark = document.getElementById('inputRemark').value.trim();

            const detailRows = document.querySelectorAll('#detailsTableBody tr');
            const details = [];

            detailRows.forEach(row => {
                const item = row.querySelector('.detail-item').value;
                if (item) {
                    details.push({
                        測量項目: item,
                        測量位置: row.querySelector('.detail-position').value,
                        尺寸下限: (v => v !== '' ? parseFloat(v) : null)(row.querySelector('.detail-size-min').value),
                        尺寸上限: (v => v !== '' ? parseFloat(v) : null)(row.querySelector('.detail-size-max').value),
                        公差下限: (v => v !== '' ? parseFloat(v) : null)(row.querySelector('.detail-tol-min').value),
                        公差上限: (v => v !== '' ? parseFloat(v) : null)(row.querySelector('.detail-tol-max').value),
                        標準值: (v => v !== '' ? parseFloat(v) : null)(row.querySelector('.detail-std').value),
                        單位: row.querySelector('.detail-unit').value || 'mm',
                        備註: row.querySelector('.detail-remark').value
                    });
                }
            });

            const payload = {
                材質: material,
                規格: spec,
                廠商ID: vendorId ? parseInt(vendorId) : null,
                備註: remark,
                details: details
            };

            try {
                const url = currentEditId
                    ? `${API_BASE}/api/tolerance/update/${currentEditId}`
                    : `${API_BASE}/api/tolerance/add`;

                const res = await fetchWithAuth(url, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '儲存失敗');
                    return;
                }

                alert('儲存成功！');
                closeEditModal();
                await searchTolerance();
            } catch (e) {
                console.error('儲存失敗:', e);
                alert('儲存失敗');
            }
        }

        // 編輯資料
        async function editData(id) {
            try {
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/${id}`);
                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '讀取失敗');
                    return;
                }

                currentEditId = id;
                const main = result.main;

                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> 編輯公差資料';
                document.getElementById('inputMaterial').value = main.材質 || '';
                document.getElementById('inputSpec').value = main.規格 || '';
                document.getElementById('inputVendor').value = main.廠商ID || '';
                document.getElementById('inputRemark').value = main.備註 || '';

                const tbody = document.getElementById('detailsTableBody');
                tbody.innerHTML = '';

                if (result.details && result.details.length > 0) {
                    result.details.forEach(detail => {
                        addDetailRow();
                        const lastRow = tbody.lastElementChild;
                        lastRow.querySelector('.detail-item').value = detail.測量項目 || '';
                        lastRow.querySelector('.detail-position').value = detail.測量位置 || '';
                        lastRow.querySelector('.detail-size-min').value = detail.尺寸下限 || '';
                        lastRow.querySelector('.detail-size-max').value = detail.尺寸上限 || '';
                        lastRow.querySelector('.detail-tol-min').value = detail.公差下限 || '';
                        lastRow.querySelector('.detail-tol-max').value = detail.公差上限 || '';
                        lastRow.querySelector('.detail-std').value = detail.標準值 || '';
                        lastRow.querySelector('.detail-unit').value = detail.單位 || 'mm';
                        lastRow.querySelector('.detail-remark').value = detail.備註 || '';
                    });
                } else {
                    addDetailRow();
                }

                document.getElementById('editModal').classList.add('show');
            } catch (e) {
                console.error('讀取失敗:', e);
                alert('讀取失敗');
            }
        }

        // 查看詳情
        async function viewDetail(id) {
            try {
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/${id}`);
                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '讀取失敗');
                    return;
                }

                const main = result.main;
                document.getElementById('viewMaterial').textContent = main.材質 || '-';
                document.getElementById('viewSpec').textContent = main.規格 || '-';
                document.getElementById('viewVendor').textContent = main.廠商名稱 || '-';
                document.getElementById('viewCreateDate').textContent = main.建立日期 || '-';
                document.getElementById('viewRemark').textContent = main.備註 || '-';

                const tbody = document.getElementById('viewDetailsBody');
                if (result.details && result.details.length > 0) {
                    tbody.innerHTML = result.details.map(d => `
                        <tr>
                            <td>${displayValue(d.測量項目)}</td>
                            <td>${displayValue(d.測量位置)}</td>
                            <td>${displayValue(d.尺寸下限)}</td>
                            <td>${displayValue(d.尺寸上限)}</td>
                            <td>${displayValue(d.公差下限)}</td>
                            <td>${displayValue(d.公差上限)}</td>
                            <td>${displayValue(d.標準值)}</td>
                            <td>${displayValue(d.單位)}</td>
                            <td>${displayValue(d.備註)}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color: #9ca3af;">暫無明細</td></tr>';
                }

                document.getElementById('viewModal').classList.add('show');
            } catch (e) {
                console.error('讀取失敗:', e);
                alert('讀取失敗');
            }
        }

        // 關閉查看 Modal
        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('show');
        }

        // 刪除資料
        async function deleteData(id) {
            if (!confirm('確定要刪除此筆公差資料嗎？此操作無法復原！')) {
                return;
            }

            try {
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/delete/${id}`, {
                    method: 'POST'
                });

                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '刪除失敗');
                    return;
                }

                alert('刪除成功！');
                await searchTolerance();
            } catch (e) {
                console.error('刪除失敗:', e);
                alert('刪除失敗');
            }
        }

        // 匯入 Excel
        async function handleImport() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/api/tolerance/import`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                const result = await res.json();

                if (!result.success) {
                    alert(result.error || '匯入失敗');
                    return;
                }

                alert(result.message || '匯入成功！');
                document.getElementById('importFile').value = '';
                await searchTolerance();
            } catch (e) {
                console.error('匯入失敗:', e);
                alert('匯入失敗');
            }
        }

        // 匯出 Excel
        async function handleExport() {
            try {
                const material = document.getElementById('searchMaterial').value;
                const vendorId = document.getElementById('searchVendor').value;
                const spec = document.getElementById('searchSpec').value;

                const params = new URLSearchParams();
                if (material) params.append('material', material);
                if (vendorId) params.append('vendor_id', vendorId);
                if (spec) params.append('spec', spec);

                // 使用 fetch 下載並帶上認證 Token
                const res = await fetchWithAuth(`${API_BASE}/api/tolerance/export?${params}`);

                if (!res.ok) {
                    const error = await res.json();
                    alert(error.error || '匯出失敗');
                    return;
                }

                // 取得檔案 blob
                const blob = await res.blob();

                // 創建下載連結
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `廠商公差資料_${new Date().toISOString().split('T')[0]}.xlsx`;
                document.body.appendChild(a);
                a.click();

                // 清理
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                alert('匯出成功！');
            } catch (e) {
                console.error('匯出失敗:', e);
                alert('匯出失敗');
            }
        }

        // 更新分頁UI
        function updatePagination() {
            const container = document.getElementById('paginationContainer');

            if (totalRecords === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';

            // 計算顯示範圍
            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalRecords);

            document.getElementById('pageStart').textContent = start;
            document.getElementById('pageEnd').textContent = end;
            document.getElementById('totalRecords').textContent = totalRecords;
            document.getElementById('currentPageSpan').textContent = currentPage;
            document.getElementById('totalPagesSpan').textContent = totalPages;

            // 更新按鈕狀態
            document.getElementById('firstPageBtn').disabled = currentPage === 1;
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
            document.getElementById('lastPageBtn').disabled = currentPage === totalPages;
        }

        // 跳轉到指定頁
        function goToPage(page) {
            if (page < 1 || page > totalPages || page === currentPage) {
                return;
            }
            searchTolerance(page);
        }

    </script>
</body>

</html>
